name: "CI/CD Continuous Delivery Pipeline"

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # Estrategia de Optimización: Cancela ejecuciones obsoletas

jobs:
  # ===============================================================
  # ETAPA 1: DETECCIÓN DE CAMBIOS (EJECUCIÓN SELECTIVA)
  # ===============================================================
  detect-changes:
    name: Change Detection (Selective Execution)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'pom.xml'
            docs:
              - 'README.md'
              - 'Entregables.md'
              - 'api-admisiones.yaml'

  # ===============================================================
  # ETAPAS PARALELAS: BUILD & TEST + QUALITY AUDIT
  # ===============================================================
  build-and-test:
    name: Build & Unit Tests
    needs: detect-changes
    # Ejecución Selectiva: Solo compilar y probar si hay cambios en el código/pom
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven' # Estrategia de Optimización: Cache

      - name: Compile and Run Tests
        run: mvn test

      - name: Package JAR Artifact
        run: mvn package -DskipTests

      - name: Upload Build Artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: target/*.jar
          retention-days: 5

  # Invocación de Pipeline Modular Reutilizable en paralelo
  quality-audit:
    name: Call Reusable Quality Workflow
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-quality.yml
    with:
      java-version: '17'

  # ===============================================================
  # ETAPA: ENTREGA CONTINUA / DEPLOY STAGING (SOLO MAIN)
  # ===============================================================
  cd-delivery:
    name: Continuous Delivery (Production Artifacts)
    needs: [build-and-test, quality-audit]
    # Ejecución selectiva por rama: Solo entrega en push a main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: dist/

      - name: Delivery & Release Readiness Step
        run: |
          echo "Desplegando paquete verificado a entorno de Entrega Continua..."
          ls -la dist/
          echo "Pipeline de entrega continua ejecutado con éxito para rama main."

  # ===============================================================
  # POST-ACTIONS & NOTIFICACIONES (ALWAYS, SUCCESS, FAIL)
  # ===============================================================
  notifications:
    name: Post Execution Notifications
    needs: [detect-changes, build-and-test, quality-audit, cd-delivery]
    if: always() # Estrategia Post: Always
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # POST: ALWAYS - Generación del Step Summary oficial en GitHub Actions
      - name: Generate Workflow Summary Report
        run: |
          echo "## 📊 Reporte de Ejecución del Pipeline CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Detección Selectiva | ${{ needs.detect-changes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Tests | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Análisis de Calidad | ${{ needs.quality-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Entrega Continua (CD) | ${{ needs.cd-delivery.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rama:** \`${{ github.ref }}\` | **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      # POST: SUCCESS - Notificación en caso de éxito
      - name: Notify Success (PR Comment o Webhook)
        if: |
          contains(needs.*.result, 'failure') == false &&
          contains(needs.*.result, 'cancelled') == false
        run: |
          echo "🚀 [PIPELINE SUCCESS] Todas las etapas pasaron satisfactoriamente para la rama ${{ github.ref }}."
          if [ -n "${{ secrets.NOTIFICATION_WEBHOOK }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"✅ Pipeline CI/CD exitoso en rama '${{ github.ref }}' - Commit: '${{ github.sha }}'"}' \
              ${{ secrets.NOTIFICATION_WEBHOOK }} || true
          fi

      # POST: FAIL - Notificación e Issue automático en caso de fallo
      - name: Notify Failure and Log Issue
        if: contains(needs.*.result, 'failure')
        run: |
          echo "❌ [PIPELINE FAILED] Hubo un error en una o más etapas del pipeline."
          if [ -n "${{ secrets.NOTIFICATION_WEBHOOK }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"❌ ALERTA: Pipeline CI/CD falló en rama '${{ github.ref }}' - Commit: '${{ github.sha }}'"}' \
              ${{ secrets.NOTIFICATION_WEBHOOK }} || true
          fi
