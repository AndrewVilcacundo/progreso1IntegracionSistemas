
version: 2.1

executors:
  maven-executor:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/project
    environment:
      MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

commands:

  restore_maven_cache:
    description: "Restaura la cache de dependencias Maven"
    steps:
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

  save_maven_cache:
    description: "Guarda las dependencias Maven"
    steps:
      - save_cache:
          paths:
            - .m2/repository
          key: v1-dependencies-{{ checksum "pom.xml" }}

  notify_discord:
    description: "Envia notificacion de exito a Discord"
    steps:
      - run:
          name: Notificar exito en Discord
          command: |
            if [ -z "$DISCORD_WEBHOOK" ]; then
              echo "DISCORD_WEBHOOK no configurada."
              exit 0
            fi

            curl -fsS -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\":\"SUCCESS: Pipeline ejecutado correctamente. Rama: ${CIRCLE_BRANCH}. Commit: ${CIRCLE_SHA1:0:7}. Ejecucion: ${CIRCLE_BUILD_URL}\"}" \
              "$DISCORD_WEBHOOK"

  notify_discord_failure:
    description: "Envia notificacion cuando falla un job"
    steps:
      - run:
          name: Notificar fallo en Discord
          when: on_fail
          command: |
            if [ -z "$DISCORD_WEBHOOK" ]; then
              echo "DISCORD_WEBHOOK no configurada."
              exit 0
            fi

            curl -fsS -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\":\"FAILURE: El pipeline ha fallado. Job: ${CIRCLE_JOB}. Rama: ${CIRCLE_BRANCH}. Commit: ${CIRCLE_SHA1:0:7}. Ejecucion: ${CIRCLE_BUILD_URL}\"}" \
              "$DISCORD_WEBHOOK"

jobs:

  checkout-code:
    executor: maven-executor
    steps:
      - checkout
      - run:
          name: Identificar rama y commit
          command: |
            echo "Proyecto: $CIRCLE_PROJECT_REPONAME"
            echo "Rama: $CIRCLE_BRANCH"
            echo "Commit: $CIRCLE_SHA1"
      - persist_to_workspace:
          root: ~/project
          paths:
            - .
      - notify_discord_failure

  build:
    executor: maven-executor
    steps:
      - attach_workspace:
          at: ~/project
      - restore_maven_cache
      - run:
          name: Descargar dependencias y compilar
          command: |
            mvn -B dependency:go-offline -Dmaven.repo.local=.m2/repository || true
            mvn -B compile -DskipTests -Dmaven.repo.local=.m2/repository
      - save_maven_cache
      - persist_to_workspace:
          root: ~/project
          paths:
            - .m2/repository
            - target
      - notify_discord_failure

  unit-tests:
    executor: maven-executor
    steps:
      - attach_workspace:
          at: ~/project
      - restore_maven_cache
      - run:
          name: Ejecutar pruebas unitarias
          command: mvn -B test -Dmaven.repo.local=.m2/repository
      - store_test_results:
          path: target/surefire-reports
      - store_artifacts:
          path: target/surefire-reports
          destination: surefire-reports
      - notify_discord_failure

  code-quality:
    executor: maven-executor
    steps:
      - attach_workspace:
          at: ~/project
      - restore_maven_cache
      - run:
          name: Analisis de calidad Checkstyle y SpotBugs
          command: mvn -B checkstyle:checkstyle spotbugs:check -Dmaven.repo.local=.m2/repository
      - store_artifacts:
          path: target/checkstyle-result.xml
          destination: quality-reports/checkstyle-result.xml
      - store_artifacts:
          path: target/spotbugsXml.xml
          destination: quality-reports/spotbugsXml.xml
      - notify_discord_failure

  package-and-delivery:
    executor: maven-executor
    steps:
      - attach_workspace:
          at: ~/project
      - restore_maven_cache
      - run:
          name: Empaquetar artefacto JAR
          command: mvn -B package -DskipTests -Dmaven.repo.local=.m2/repository
      - run:
          name: Verificar artefacto generado
          command: |
            if ls target/*.jar 1> /dev/null 2>&1; then
              echo "JAR generado correctamente:"
              ls -lh target/*.jar
            else
              echo "ERROR: No se genero ningun JAR."
              exit 1
            fi
      - store_artifacts:
          path: target
          destination: binaries
      - notify_discord_failure

  notify-success:
    executor: maven-executor
    steps:
      - notify_discord

workflows:
  version: 2

  ci_cd_pipeline:
    jobs:
      - checkout-code:
          filters:
            branches:
              only:
                - main

      - build:
          requires:
            - checkout-code
          filters:
            branches:
              only:
                - main

      - unit-tests:
          requires:
            - build
          filters:
            branches:
              only:
                - main

      - code-quality:
          requires:
            - build
          filters:
            branches:
              only:
                - main

      - package-and-delivery:
          requires:
            - unit-tests
            - code-quality
          filters:
            branches:
              only:
                - main

      - notify-success:
          requires:
            - package-and-delivery
          filters:
            branches:
              only:
                - main

  develop_validation:
    jobs:
      - checkout-code:
          filters:
            branches:
              only:
                - develop

      - build:
          requires:
            - checkout-code
          filters:
            branches:
              only:
                - develop

      - unit-tests:
          requires:
            - build
          filters:
            branches:
              only:
                - develop

      - code-quality:
          requires:
            - build
          filters:
            branches:
              only:
                - develop
